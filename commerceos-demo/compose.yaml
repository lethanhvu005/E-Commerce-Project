services:
  db:
    image: postgres:17
    container_name: commerceos-db
    environment:
      POSTGRES_DB: commerceos_demo
      POSTGRES_USER: commerceos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?123}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceos -d commerceos_demo"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data: