services:
  - type: web
    name: nexa-commerceos-lethanhvu005-api
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: python manage.py migrate --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: nexa-commerceos-lethanhvu005-api.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://nexa-commerceos-lethanhvu005.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://nexa-commerceos-lethanhvu005.onrender.com,https://nexa-commerceos-lethanhvu005-api.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DATABASE_URL
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: nexa-commerceos-lethanhvu005
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://nexa-commerceos-lethanhvu005-api.onrender.com/api
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
